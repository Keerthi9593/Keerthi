version: 2

sources:
  - name: production
    database: BIKESTORES
    schema: PRODUCTION
    tables:
      - name: brands
      - name: categories
      - name: products
      - name: stocks

  - name: sales
    database: BIKESTORES
    schema: SALES
    tables:
      - name: customers
      - name: orders
      - name: order_items
      - name: staffs
      - name: stores

models:
  - name: stg_customers
    description: Cleaned and standardized customer data from sales
    config:
      tags: ["silver"]
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - unique
          - not_null
      - name: full_name
        description: Full name of the customer (First + Last)
      - name: email
        description: Customer email address
        tests:
          - not_null
      - name: full_address
        description: Complete formatted address
      - name: city
        description: Customer city
      - name: state
        description: Customer state

  - name: stg_orders
    description: Cleaned orders with status labels and shipping delay calculations
    config:
      tags: ["silver"]
    columns:
      - name: order_id
        description: Unique identifier for each order
        tests:
          - unique
          - not_null
      - name: order_status_label
        description: Human-readable order status
        tests:
          - accepted_values:
              arguments:
                values:
                  ["Pending", "Processing", "Rejected", "Completed", "Unknown"]
      - name: order_date
        description: Date the order was placed
      - name: shipping_delay_days
        description: Days between order date and shipped date
      - name: customer_id
        description: FK to customers
      - name: store_id
        description: FK to stores
      - name: staff_id
        description: FK to staffs

  - name: stg_order_items
    description: Order line items with calculated net price
    config:
      tags: ["silver"]
    columns:
      - name: order_item_key
        description: Surrogate key for each order line item
        tests:
          - unique
          - not_null
      - name: order_id
        description: FK to orders
      - name: product_id
        description: FK to products
      - name: quantity
        description: Quantity ordered
      - name: list_price
        description: Listed price per unit
      - name: discount
        description: Discount percentage applied
      - name: net_price
        description: Calculated revenue (quantity * list_price * (1 - discount))
        tests:
          - not_null

  - name: stg_products
    description: Products enriched with brand and category names
    config:
      tags: ["silver"]
    columns:
      - name: product_id
        description: Unique identifier for each product
        tests:
          - unique
          - not_null
      - name: product_name
        description: Name of the product
      - name: brand_name
        description: Brand name from brands table
      - name: category_name
        description: Category name from categories table
      - name: model_year
        description: Model year of the product
      - name: list_price
        description: Listed retail price

  - name: stg_stores
    description: Cleaned store data with formatted addresses
    config:
      tags: ["silver"]
    columns:
      - name: store_id
        description: Unique identifier for each store
        tests:
          - unique
          - not_null
      - name: store_name
        description: Name of the store
      - name: email
        description: Store email address
      - name: full_address
        description: Complete formatted store address
      - name: city
        description: Store city
      - name: state
        description: Store state

  - name: stg_staffs
    description: Staff data enriched with store name and active status
    config:
      tags: ["silver"]
    columns:
      - name: staff_id
        description: Unique identifier for each staff member
        tests:
          - unique
          - not_null
      - name: full_name
        description: Full name of the staff member
      - name: email
        description: Staff email address
      - name: active_status
        description: Active or Inactive status label
        tests:
          - accepted_values:
              arguments:
                values: ["Active", "Inactive"]
      - name: store_id
        description: FK to stores
      - name: store_name
        description: Name of the assigned store

  - name: stg_stocks
    description: Stock levels enriched with product and store names
    config:
      tags: ["silver"]
    columns:
      - name: stock_key
        description: Surrogate key for each store-product stock record
        tests:
          - unique
          - not_null
      - name: store_id
        description: FK to stores
      - name: store_name
        description: Name of the store
      - name: product_id
        description: FK to products
      - name: product_name
        description: Name of the product
      - name: quantity
        description: Quantity in stock
