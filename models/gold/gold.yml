version: 2

models:
  - name: fct_sales
    description: Fact table with one row per order line item, enriched with all dimensions
    config:
      tags: ['gold']
    columns:
      - name: order_item_key
        description: Surrogate key for each order line item
        tests:
          - unique
          - not_null
      - name: order_id
        description: Order identifier
      - name: order_date
        description: Date the order was placed
      - name: order_status_label
        description: Human-readable order status
      - name: customer_id
        description: FK to customer
      - name: customer_name
        description: Full name of the customer
      - name: product_id
        description: FK to product
      - name: product_name
        description: Name of the product
      - name: brand_name
        description: Brand of the product
      - name: category_name
        description: Category of the product
      - name: store_id
        description: FK to store
      - name: store_name
        description: Name of the store
      - name: staff_id
        description: FK to staff
      - name: staff_name
        description: Full name of the staff member
      - name: quantity
        description: Quantity ordered
      - name: list_price
        description: Listed price per unit
      - name: discount
        description: Discount percentage applied
      - name: net_price
        description: Calculated net revenue for the line item

  - name: dim_customers
    description: Customer dimension with order history metrics
    config:
      tags: ['gold']
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - unique
          - not_null
      - name: full_name
        description: Full name of the customer
      - name: email
        description: Customer email address
      - name: total_orders
        description: Total number of distinct orders placed
      - name: total_spend
        description: Total revenue from all orders
      - name: first_order_date
        description: Date of the customer's first order
      - name: last_order_date
        description: Date of the customer's most recent order
      - name: avg_order_line_value
        description: Average revenue per order line item

  - name: dim_products
    description: Product dimension with sales performance metrics
    config:
      tags: ['gold']
    columns:
      - name: product_id
        description: Unique identifier for each product
        tests:
          - unique
          - not_null
      - name: product_name
        description: Name of the product
      - name: brand_name
        description: Brand of the product
      - name: category_name
        description: Category of the product
      - name: model_year
        description: Model year
      - name: list_price
        description: Listed retail price
      - name: total_units_sold
        description: Total units sold across all orders
      - name: total_revenue
        description: Total net revenue generated
      - name: avg_discount
        description: Average discount applied
      - name: total_orders
        description: Total distinct orders containing this product

  - name: dim_stores
    description: Store dimension with revenue, staff, and inventory metrics
    config:
      tags: ['gold']
    columns:
      - name: store_id
        description: Unique identifier for each store
        tests:
          - unique
          - not_null
      - name: store_name
        description: Name of the store
      - name: full_address
        description: Complete formatted store address
      - name: total_revenue
        description: Total net revenue for the store
      - name: total_orders
        description: Total distinct orders processed
      - name: unique_customers
        description: Count of unique customers served
      - name: active_staff_count
        description: Number of active staff members
      - name: total_stock_quantity
        description: Total inventory quantity across all products
      - name: distinct_products_in_stock
        description: Number of distinct products in stock

  - name: rpt_monthly_sales
    description: Monthly aggregated sales report by store
    config:
      tags: ['gold']
    columns:
      - name: month
        description: First day of the month
      - name: store_name
        description: Name of the store
      - name: total_orders
        description: Total orders in the month
      - name: total_units
        description: Total units sold in the month
      - name: total_revenue
        description: Total net revenue in the month
      - name: avg_order_value
        description: Average order value in the month
      - name: unique_customers
        description: Unique customers who ordered in the month

  - name: rpt_top_products
    description: Product ranking report by revenue and units sold
    config:
      tags: ['gold']
    columns:
      - name: product_name
        description: Name of the product
      - name: brand_name
        description: Brand of the product
      - name: category_name
        description: Category of the product
      - name: total_units_sold
        description: Total units sold
      - name: total_revenue
        description: Total net revenue
      - name: avg_discount
        description: Average discount applied
      - name: total_orders
        description: Total distinct orders
      - name: revenue_rank
        description: Rank by total revenue (1 = highest)
      - name: units_sold_rank
        description: Rank by total units sold (1 = highest)

  - name: rpt_staff_performance
    description: Staff performance report with revenue and order metrics
    config:
      tags: ['gold']
    columns:
      - name: staff_name
        description: Full name of the staff member
      - name: store_name
        description: Store the staff belongs to
      - name: total_orders
        description: Total orders handled
      - name: total_units_sold
        description: Total units sold
      - name: total_revenue
        description: Total net revenue generated
      - name: avg_order_value
        description: Average order value
      - name: unique_customers
        description: Unique customers served